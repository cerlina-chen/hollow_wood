<title>The Hollow Wood</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Vollkorn:wght@400;600&display=swap">
<style>
/* Layout: one full-screen pixel world you pan; HUD floats over it; sheets and the journal rise from below as in-world objects. */
:root{
  --night:#121827; --night2:#1B2236; --night3:#27314B;
  --wood:#5E3D2C; --wood2:#7A5038; --wood3:#9C6A3A;
  --gold:#E9B65A; --glow:#FFD27A; --core:#FFF2B8;
  --cream:#F3E6C8; --mist:#9AA3B8; --mist2:#C9CFDC;
  --page:#EFE2C2; --page2:#E2D2AE; --ink:#2A2A36; --muted:#6A5A4A;
  --true:#3E6847; --true2:#9FD36A; --tale:#B05A3C;
  --pixel:"Pixelify Sans", ui-monospace, monospace;
  --serif:"Vollkorn", Georgia, serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--cream);font-family:var(--serif);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
a{color:inherit}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--night)}

/* pixel frames */
.px{clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px)}
.plaque{background:var(--night2);box-shadow:inset 0 0 0 4px var(--wood),inset 0 0 0 7px var(--gold)}
.woodsign{background:var(--wood2);box-shadow:inset 0 0 0 4px var(--wood),inset 0 0 0 7px var(--wood3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;font-family:var(--pixel);font-weight:700;font-size:17px;background:var(--gold);color:#2A1E18;box-shadow:inset 0 0 0 4px var(--wood),inset 0 7px 0 0 var(--glow)}
.btn:active{transform:translateY(2px)}
.btn.quiet{background:var(--night2);color:var(--cream);box-shadow:inset 0 0 0 4px var(--wood),inset 0 7px 0 0 var(--night3)}
.btn.onpage{background:var(--page2);color:var(--ink);box-shadow:inset 0 0 0 4px var(--wood)}
.label{font-family:var(--pixel);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* world */
#world{position:absolute;inset:0;overflow:auto;scrollbar-width:none;touch-action:pan-x pan-y;cursor:grab}
#world::-webkit-scrollbar{display:none}
#world.dragging{cursor:grabbing}
#worldInner{position:relative;width:1260px}
#map{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.place{position:absolute;transform:translate(-50%,-50%);padding:6px 9px 7px;font-family:var(--pixel);font-weight:600;font-size:12px;white-space:nowrap;color:var(--mist2);background:rgba(18,24,39,.82);box-shadow:inset 0 0 0 2px var(--mist);display:flex;align-items:center;gap:6px}
.place.known{color:var(--glow);box-shadow:inset 0 0 0 2px var(--gold)}
.place.future{color:#6F7890;box-shadow:inset 0 0 0 2px #3A4566;font-weight:500}
.place .spark{width:6px;height:6px;background:var(--glow);animation:twinkle 1.6s steps(2) infinite}
.sprite{position:absolute;width:26px;height:30px;transform:translate(-50%,-100%);pointer-events:none;image-rendering:pixelated;animation:bob 2.4s steps(2) infinite;transition:opacity .8s}
.sprite.hide{opacity:0}
.fly{position:absolute;width:4px;height:4px;background:var(--core);box-shadow:0 0 6px 2px rgba(255,210,122,.6);pointer-events:none;animation:fly 5s ease-in-out infinite}
.burst{position:absolute;width:20px;height:20px;transform:translate(-50%,-50%);border:4px solid var(--glow);pointer-events:none;animation:burst 1.4s ease-out forwards}
@keyframes bob{50%{transform:translate(-50%,-104%)}}
@keyframes twinkle{50%{opacity:.25}}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(10px,-14px);opacity:1}}
@keyframes burst{to{width:220px;height:220px;opacity:0;border-width:2px}}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;align-items:flex-start;padding-top:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
#region{padding:11px 16px 12px;min-width:0}
#region b{display:block;font-family:var(--pixel);font-size:19px;font-weight:700;line-height:1.1}
#region span{font-family:var(--pixel);font-size:12px;color:var(--mist2)}
.hud .sp{flex:1}
.iconbtn{width:52px;height:52px;display:grid;place-items:center;position:relative}
.iconbtn svg{width:26px;height:26px;image-rendering:pixelated}
.dot{position:absolute;top:6px;right:6px;width:10px;height:10px;background:var(--glow);box-shadow:0 0 0 2px var(--wood)}
#lantern{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:76px;height:76px;display:grid;place-items:center}
#lantern svg{width:76px;height:76px;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(242,181,92,.55))}
#lantern:active{transform:translateX(-50%) translateY(2px)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom,0px));font-family:var(--pixel);font-size:13px;padding:8px 12px;background:rgba(18,24,39,.9);box-shadow:inset 0 0 0 2px var(--mist);white-space:nowrap;color:var(--mist2)}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(8,10,18,.55);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:26px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto}
.sheet.on{transform:none}
.sheet h2{font-family:var(--pixel);font-weight:700;font-size:22px;margin:0 0 4px;padding-right:44px;text-wrap:balance}
.sheet .x{position:absolute;top:16px;right:max(18px,env(safe-area-inset-right,0px));width:40px;height:40px;font-family:var(--pixel);font-size:20px;display:grid;place-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.sub{color:var(--mist2);font-size:15px;line-height:1.4;margin:0}
.safety{display:flex;gap:8px;align-items:center;font-size:14px;color:#F2DDB0;margin:2px 0 4px}
.safety i{width:10px;height:10px;background:var(--true2);flex:none;box-shadow:3px 3px 0 #4F8040}
.source-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 14px;font-family:var(--pixel);font-weight:600;font-size:14px}
.source-btn svg{width:34px;height:34px;image-rendering:pixelated}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.samples button{aspect-ratio:3/4;background-size:cover;background-position:center;box-shadow:inset 0 0 0 4px var(--wood),inset 0 0 0 6px var(--gold);position:relative;max-width:100%}
.samples button span{position:absolute;left:6px;bottom:6px;font-family:var(--pixel);font-size:11px;background:rgba(18,24,39,.85);padding:3px 5px}
.lightring{width:min(62vw,240px);aspect-ratio:1;margin:4px auto 6px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 5px var(--gold),0 0 0 9px var(--wood),0 0 40px 12px rgba(242,181,92,.35)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{text-align:left;padding:10px 12px 11px;background:var(--night2);box-shadow:inset 0 0 0 3px var(--wood);display:flex;flex-direction:column;gap:6px;font-family:var(--pixel);font-size:14px;font-weight:600;line-height:1.2;min-height:64px}
.choice svg{width:28px;height:28px;image-rendering:pixelated}
.choice[aria-pressed="true"]{background:#3A3150;box-shadow:inset 0 0 0 3px var(--gold);color:var(--glow)}
.suggest{font-family:var(--pixel);font-size:12px;color:var(--glow)}

/* reveal */
#reveal{position:absolute;inset:0;background:var(--night);touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;width:100%;height:100%}
#revealTop{position:absolute;left:0;right:0;top:0;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#revealTop>*{pointer-events:auto}
.tag{font-family:var(--pixel);font-weight:600;font-size:13px;padding:6px 9px;background:rgba(18,24,39,.85)}
#dragHint{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--pixel);font-weight:700;font-size:15px;padding:10px 14px;background:rgba(18,24,39,.9);box-shadow:inset 0 0 0 3px var(--gold);color:var(--glow);pointer-events:none;white-space:nowrap;transition:opacity .3s}
#revealCap{position:absolute;left:0;right:0;bottom:0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(10,12,20,.92) 34%);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#revealCap.on{transform:none}
#revealCap h2{font-family:var(--pixel);font-size:26px;margin:0;color:var(--glow);text-shadow:2px 2px 0 #000}
#revealCap p{margin:4px 0 14px;color:var(--mist2);font-size:15px}

/* journal */
#book{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:rgba(8,10,18,.72);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#book.on{transform:none}
.ribbons{display:flex;align-items:flex-end;gap:6px;padding-left:18px;height:46px}
.ribbon{font-family:var(--pixel);font-weight:700;font-size:14px;padding:10px 12px 8px;background:var(--wood2);color:#E8D5AE;box-shadow:inset 0 0 0 3px var(--wood)}
.ribbon[aria-selected="true"]{background:var(--tale);color:var(--cream);padding-bottom:14px}
.ribbons .x{margin-left:auto;width:44px;height:44px;font-family:var(--pixel);font-size:20px;background:var(--night2);box-shadow:inset 0 0 0 3px var(--wood);color:var(--cream)}
.bookpage{flex:1;min-height:0;overflow:auto;background:var(--page);color:var(--ink);box-shadow:inset 0 0 0 4px var(--wood),inset 0 0 0 8px var(--gold),inset 0 14px 0 8px var(--page2);padding:28px 24px 26px;position:relative}
.bookpage h2{font-family:var(--pixel);font-weight:700;font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
.bookpage .kicker{font-family:var(--pixel);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tale);margin-top:4px}
.bookpage p{font-size:17px;line-height:1.5;margin:0}
.lead{color:var(--muted);font-size:15px!important}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.frame{position:relative;aspect-ratio:3/4;background:#000 center/cover no-repeat;box-shadow:inset 0 0 0 4px var(--wood),inset 0 0 0 6px var(--cream);max-width:100%;image-rendering:pixelated}
.frame.kingdom{box-shadow:inset 0 0 0 4px var(--wood),inset 0 0 0 6px var(--gold)}
.cap{font-family:var(--pixel);font-size:12px;color:var(--muted);margin-top:6px}
.cap.k{color:var(--tale)}
.block{margin-top:20px;display:flex;flex-direction:column;gap:6px}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mark.true{color:var(--true)} .mark.tale{color:var(--tale)}
.mark .sq{width:12px;height:12px;background:var(--true);box-shadow:inset 0 0 0 3px var(--true),inset 0 0 0 6px var(--true2)}
.mark .st{width:12px;height:12px;background:linear-gradient(var(--tale),var(--tale)) center/4px 12px no-repeat,linear-gradient(var(--tale),var(--tale)) center/12px 4px no-repeat}
.tale-text{color:#4A3A30}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--muted)}
.note{font-size:14px!important;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.entry{text-align:left;display:flex;flex-direction:column;gap:6px}
.entry .mini{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.entry b{font-family:var(--pixel);font-size:14px}
.entry small{font-family:var(--pixel);font-size:11px;color:var(--muted)}
.back{font-family:var(--pixel);font-weight:600;font-size:14px;color:var(--tale);margin-bottom:14px;display:inline-block}
.factrow{padding:16px 0;border-top:3px solid var(--page2);display:flex;flex-direction:column;gap:6px}
.factrow:first-of-type{border-top:0}
.factrow h3{font-family:var(--pixel);font-size:15px;margin:0}
.thread{margin-top:16px;padding:16px;background:var(--page2);box-shadow:inset 0 0 0 3px var(--wood);display:flex;flex-direction:column;gap:12px}
.thread.woven{box-shadow:inset 0 0 0 3px var(--gold);background:#E9DBB4}
.thread h3{font-family:var(--pixel);font-size:17px;margin:0}
.slots{display:grid;grid-template-columns:1fr 26px 1fr;align-items:center;gap:6px}
.slot{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-family:var(--pixel);font-size:12px;color:var(--muted)}
.slot .sq{width:64px;height:64px;background:#000 center/cover no-repeat;box-shadow:inset 0 0 0 3px var(--wood);image-rendering:pixelated}
.slot .sq.empty{background:transparent;box-shadow:inset 0 0 0 3px #9A8A6A;display:grid;place-items:center;font-size:26px;color:#9A8A6A}
.knot{height:4px;background:#B9A57E}
.knot.on{background:var(--gold);box-shadow:0 0 8px var(--glow)}
.pill{display:inline-block;font-family:var(--pixel);font-size:11px;font-weight:600;padding:3px 7px;background:var(--wood);color:var(--cream)}
.pill.on{background:var(--true)}
.pill.wait{background:#9A8A6A}
.placerow{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:3px solid var(--page2);width:100%;text-align:left}
.placerow:first-of-type{border-top:0}
.go{font-family:var(--pixel);font-weight:700;font-size:13px;color:var(--tale);flex:none}
.placerow div{flex:1;min-width:0}
.placerow b{font-family:var(--pixel);font-size:16px;display:block}
.placerow span{font-size:14px;color:var(--muted)}
.empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:56px;height:56px;image-rendering:pixelated}
.pagefoot{margin-top:24px;display:flex;flex-direction:column;gap:10px}

/* journal v2: fact + tale in one card, ties, mysteries */
.duo{margin-top:18px;padding:14px 16px 16px;background:var(--page2);box-shadow:inset 0 0 0 3px var(--wood);display:flex;flex-direction:column}
.duo .block{margin-top:0}
.duo-tie{height:18px;margin:4px 0 4px 5px;border-left:3px dotted var(--gold)}
.ties,.solved{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.ties .mark,.solved .mark{color:var(--muted)}
.knotmark{width:12px;height:4px;background:var(--gold)}
.tie{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:transparent;box-shadow:inset 0 0 0 2px #B9A57E;font-size:14px;color:var(--muted);text-align:left;width:100%}
.tie b{font-family:var(--pixel);font-size:13px;flex:none}
.tie.on{box-shadow:inset 0 0 0 3px var(--gold);background:#E9DBB4;color:var(--ink)}
.tie.on b{color:var(--tale)}
.myst{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;text-align:left;width:100%;margin-top:12px;padding:12px;background:var(--page2);box-shadow:inset 0 0 0 3px var(--wood)}
.myst img{grid-row:span 2;width:44px;height:50px;image-rendering:pixelated}
.myst .mq{font-size:16px;line-height:1.35;color:var(--ink)}
.myst .look{font-family:var(--pixel);font-size:12px;color:var(--tale)}
#tagR{transition:opacity .3s}
/* tap the drawn object */
.hit{position:absolute;background:transparent;cursor:pointer}
.entry,.myst,.tie.on,.pair.replay{transition:transform .1s,box-shadow .15s}
.entry:active,.myst:active,.tie.on:active,.pair.replay:active{transform:translateY(1px)}
.pair.replay{width:100%;text-align:left}
.play{position:absolute;right:10px;bottom:10px;width:0;height:0;border-left:12px solid var(--glow);border-top:8px solid transparent;border-bottom:8px solid transparent;filter:drop-shadow(1px 1px 0 #000)}
/* intro */
#intro{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(8,10,18,.78);z-index:5}
.intro-card{width:min(100%,380px);padding:26px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.intro-art{min-height:110px;display:grid;place-items:center}
.intro-art canvas{width:288px;height:162px;image-rendering:pixelated}
.intro-art img{image-rendering:pixelated;width:144px!important;height:96px!important}
.intro-art svg{width:96px;height:96px;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(242,181,92,.55))}
#introTitle{margin:0;font-family:var(--pixel);font-weight:700;font-size:38px;line-height:1.05;color:var(--glow);text-shadow:3px 3px 0 #000;letter-spacing:.01em}
#intro.title .intro-art canvas{width:324px;height:182px}
#intro.title{background:rgba(8,10,18,.9)}
#introText{margin:0;font-size:19px;line-height:1.45;color:var(--cream);text-wrap:pretty}
.intro-row{display:flex;gap:10px;width:100%}.intro-row .btn{flex:1}
.intro-dots{display:flex;gap:8px}.intro-dots i{width:8px;height:8px;background:var(--night3)}.intro-dots i.on{background:var(--glow)}
/* guide */
#guide{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;width:min(92%,360px)}
#guide img{width:36px;height:24px;image-rendering:pixelated;flex:none}
#guide p{margin:0;font-size:15px;line-height:1.35;color:var(--cream);flex:1}
#guide button{flex:none;width:36px;height:36px;font-family:var(--pixel);font-size:16px;display:grid;place-items:center;color:var(--cream)}
#journalBtn.nudge{animation:nudge 1.4s steps(2) infinite}
@keyframes nudge{50%{box-shadow:inset 0 0 0 4px var(--wood),inset 0 0 0 7px var(--glow),0 0 14px 4px rgba(255,210,122,.6)}}
/* place sign */
#sign .stack{gap:8px}
#sign .who{font-family:var(--pixel);font-size:13px;color:#F2DDB0}
.hint{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:rgba(18,24,39,.45);font-size:15px;line-height:1.35}
.hint .k{font-family:var(--pixel);font-size:12px;color:var(--glow);flex:none;margin-top:2px}

#toast{position:absolute;left:50%;top:calc(86px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;transition:.35s;padding:12px 16px 13px;font-family:var(--pixel);font-weight:600;font-size:15px;color:var(--cream);text-align:center;max-width:86%;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.confirm{padding:14px;background:rgba(18,24,39,.5);display:flex;flex-direction:column;gap:10px}
.small{font-size:14px;color:var(--mist2);line-height:1.45}

/* title screen: its own scene, shown every launch, before the world (Minecraft/Stardew pattern) */
#landing{position:absolute;inset:0;z-index:20;overflow:hidden;background:#0B0F1C;display:flex;flex-direction:column;align-items:center;transition:opacity .6s,transform .6s}
#landing.out{opacity:0;transform:scale(1.06);pointer-events:none}
#lScene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;image-rendering:pixelated;image-rendering:crisp-edges}
#landing::after{content:"";position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(transparent,rgba(8,10,18,.85) 40%);pointer-events:none}
.l-logo{position:relative;z-index:1;margin-top:calc(9vh + env(safe-area-inset-top,0px));text-align:center;animation:lbob 3.2s steps(2) infinite}
.l-logo .label{display:block;color:var(--mist2);margin-bottom:6px;text-shadow:2px 2px 0 #000}
.l-logo h1{margin:0;font-family:var(--pixel);font-weight:700;font-size:54px;line-height:.92;color:var(--glow);text-shadow:0 4px 0 var(--wood),4px 4px 0 #000,0 0 26px rgba(255,210,122,.35)}
#lSplash{position:absolute;right:-6px;bottom:-14px;font-family:var(--pixel);font-weight:700;font-size:15px;color:#FFF27A;text-shadow:2px 2px 0 #3A2A00;transform:rotate(-14deg);white-space:nowrap;animation:lsplash .5s ease-in-out infinite alternate}
.l-menu{position:relative;z-index:2;margin-top:auto;width:min(100% - 40px,330px);display:flex;flex-direction:column;gap:10px;padding-bottom:calc(46px + env(safe-area-inset-bottom,0px))}
.l-menu .btn{width:100%}
.l-menu .btn small{font-family:var(--pixel);font-weight:500;font-size:12px;opacity:.75}
.l-menu .row{display:flex;gap:10px}.l-menu .row .btn{flex:1;min-height:46px;font-size:15px}
.l-foot{position:absolute;z-index:2;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 16px;font-family:var(--pixel);font-size:11px;color:var(--mist)}
#lPanel{position:absolute;z-index:3;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(100% - 32px,350px);padding:22px 20px 18px}
#lPanel h2{margin:0 0 8px;font-family:var(--pixel);font-size:20px;color:var(--glow)}
#lPanel p{margin:0 0 10px}
@keyframes lbob{50%{transform:translateY(-3px)}}
@keyframes lsplash{to{transform:rotate(-14deg) scale(1.08)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div id="world" aria-label="The Hollow Wood map. Drag to explore.">
    <div id="worldInner">
      <canvas id="map" width="150" height="260"></canvas>
      <div id="layer"></div>
    </div>
  </div>

  <div class="hud">
    <div id="region" class="plaque px"><b>The Hollow Wood</b><span id="regionSub">Autumn · dusk</span></div>
    <div class="sp"></div>
    <button class="iconbtn plaque px" id="journalBtn" aria-label="Open journal">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="2" width="12" height="12" fill="#8A4B32"/><rect x="3" y="3" width="10" height="10" fill="#B05A3C"/><rect x="7" y="3" width="2" height="10" fill="#5E3D2C"/><rect x="4" y="5" width="2" height="1" fill="#E9B65A"/><rect x="10" y="5" width="2" height="1" fill="#E9B65A"/></svg>
      <i class="dot" id="newDot" hidden></i>
    </button>
    <button class="iconbtn plaque px" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="4" width="10" height="2" fill="#F3E6C8"/><rect x="3" y="7" width="10" height="2" fill="#F3E6C8"/><rect x="3" y="10" width="10" height="2" fill="#F3E6C8"/></svg>
    </button>
  </div>

  <section id="intro" hidden aria-label="Intro">
    <div class="intro-card plaque px">
      <h1 id="introTitle" hidden>The Hollow Wood</h1>
      <div class="intro-art" id="introArt"></div>
      <p id="introText"></p>
      <div class="intro-row"><button class="btn quiet px" id="introSkip">Skip</button><button class="btn px" id="introNext">Next</button></div>
      <div class="intro-dots" id="introDots"></div>
    </div>
  </section>
  <div id="guide" class="woodsign px" hidden role="status" aria-live="polite"><img alt="" id="guideImg"><p id="guideText"></p><button id="guideX" aria-label="Skip tips">✕</button></div>
  <button id="lantern" aria-label="Take a photo">
    <svg viewBox="0 0 19 19" shape-rendering="crispEdges"><rect x="1" y="0" width="17" height="19" fill="#5E3D2C"/><rect x="0" y="1" width="19" height="17" fill="#5E3D2C"/><rect x="1" y="1" width="17" height="17" fill="#E9B65A"/><rect x="2" y="2" width="15" height="15" fill="#2A2238"/><rect x="8" y="3" width="3" height="1" fill="#15100D"/><rect x="7" y="4" width="5" height="1" fill="#15100D"/><rect x="6" y="5" width="7" height="8" fill="#F2B55C"/><rect x="7" y="6" width="5" height="6" fill="#FFF2B8"/><rect x="6" y="13" width="7" height="1" fill="#15100D"/><rect x="5" y="5" width="1" height="8" fill="#15100D"/><rect x="13" y="5" width="1" height="8" fill="#15100D"/></svg>
  </button>

  <div id="toast" class="woodsign px" role="status" aria-live="polite"></div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet woodsign px" id="sign" hidden aria-label="Place"></section>
  <section class="sheet plaque px" id="observe" hidden aria-label="Take a photo"></section>
  <section class="sheet plaque px" id="menu" hidden aria-label="Menu"></section>

  <section id="reveal" hidden aria-label="Reveal">
    <canvas id="stage"></canvas>
    <div id="revealTop"><span class="tag" id="tagL">★ Kingdom</span><span class="tag" id="tagR">Your photo</span><button class="tag" id="skipReveal">Reveal all</button></div>
    <div id="dragHint">Drag the light →</div>
    <div id="revealCap">
      <h2 id="capName"></h2>
      <p id="capLine"></p>
      <div class="stack"><button class="btn" id="toJournal">Open your journal</button></div>
    </div>
  </section>

  <section id="book" hidden aria-label="Journal">
    <div class="ribbons" role="tablist">
      <button class="ribbon px" role="tab" data-tab="finds">Finds</button>
      <button class="ribbon px" role="tab" data-tab="mysteries">Mysteries</button>
      <button class="x px" id="closeBook" aria-label="Close journal">✕</button>
    </div>
    <div class="bookpage px" id="pageBody" tabindex="-1"></div>
  </section>

  <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
  <input type="file" id="libIn" accept="image/*" hidden>
  <section id="landing" aria-label="Title screen">
    <canvas id="lScene" width="200" height="430" aria-hidden="true"></canvas>
    <div class="l-logo"><span class="label">A Hidden Kingdom</span><h1>The<br>Hollow Wood</h1><span id="lSplash" aria-hidden="true"></span></div>
    <div class="l-menu" id="lMenu"></div>
    <div class="l-foot"><span>Prototype v6</span><span>Photos stay on this device</span></div>
    <div id="lPanel" class="plaque px" hidden></div>
  </section>
</div>

// paintKingdom(role, w, h, seed, tints) -> Uint8ClampedArray RGBA (w*h*4)
// tints: up to 3 [r,g,b] colours sampled from the real photo; they nudge the authored palette (30%) so each drawing echoes its photo.
function paintKingdom(role,w,h,seed,tints){
  const HX=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
  const MX=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
  const px=new Float32Array(w*h*3);
  let s=(seed>>>0)||7;const R=()=>{s=Math.imul(s^(s>>>15),2246822507)>>>0;s=Math.imul(s^(s>>>13),3266489909)>>>0;s^=s>>>16;return (s>>>0)/4294967296};
  const H2=(x,y)=>{let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+seed;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)%100};
  const set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=w||y>=h)return;const i=(y*w+x)*3;px[i]=c[0];px[i+1]=c[1];px[i+2]=c[2]};
  const get=(x,y)=>{const i=(y*w+x)*3;return[px[i],px[i+1],px[i+2]]};
  const K=HX("#1E140F"),NIGHT=HX("#121827"),N2=HX("#1B2236"),N3=HX("#27314B"),PINE=HX("#14231F"),PINE2=HX("#1A2C27"),GROUND=HX("#1D2B24"),GROUND2=HX("#23362B");
  const BARK=HX("#4A3020"),BARK2=HX("#5E3D2C"),BARKD=HX("#2A1E18"),RING1=HX("#9C6A3A"),RING2=HX("#C9A06A");
  const GLOW=HX("#F2B55C"),CORE=HX("#FFF2B8"),SILK=HX("#FFE7A0");
  const lights=[]; // additive warm pools [x,y,r,strength]
  // 1 · sky and forest at dusk
  const tall=h>w*1.05,lyT0=Math.round(h*(tall?.5:.6)),hz=Math.round(lyT0-h*(tall?.08:.14));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let c;
    if(y<hz){const t=y/hz;c=t<.45?NIGHT:(t<.55?((x+y)%2?NIGHT:N2):(t<.85?N2:((x+y)%2?N2:N3)));if(y<hz*.5&&H2(x,y)<1)c=HX("#9AA3B8")}
    else{c=(H2(x,y)<10)?GROUND2:GROUND}

}

const LANDING=(()=>{
  const cv=$("#lScene"),g=cv.getContext("2d"),LW=200,LH=430;

    for(let i=0;i<SKY.length;i++){g.fillStyle=SKY[i];g.fillRect(0,Math.floor(i*bh),LW,Math.ceil(bh)+1)}
    for(const [x,y,s,p] of stars){g.globalAlpha=.35+.65*Math.abs(Math.sin(t*.8+p));g.fillStyle="#F3E6C8";g.fillRect(x|0,y|0,s,s)}
    g.globalAlpha=1;
    g.fillStyle="#F3E6C8";g.fillRect(150,40,12,12);g.fillRect(148,42,16,8);g.fillRect(152,38,8,16);g.fillStyle="#C9CFDC";g.fillRect(153,43,3,3);g.fillRect(158,48,2,2);

    g.fillStyle=gl;g.fillRect(cx-70,cy-70,140,140);
    // the fallen birch: bark, black marks, cut end with rings
    g.fillStyle="#1A1420";g.fillRect(22,300,148,4);
    g.fillStyle="#C9C2B0";g.fillRect(22,278,146,22);g.fillStyle="#E9E3D2";g.fillRect(22,278,146,4);g.fillStyle="#9D9584";g.fillRect(22,296,146,4);
    g.fillStyle="#2E2733";for(const [x,y,w] of [[30,284,7],[48,290,5],[66,283,9],[118,286,6],[140,291,8],[156,283,4]])g.fillRect(x,y,w,2);
    g.fillStyle="#8A6A4A";g.fillRect(166,277,10,24);g.fillRect(168,275,6,28);

      for(let i=0;i<4;i++){g.fillStyle=band[i];g.fillRect(x+i,y+i*2,w-i*2,2)}}
    // moss on the shaded end

    // fireflies: a bright core with a dim plus-shaped halo
    for(const f of flies){const x=(f[0]+Math.sin(t*f[3]+f[2])*10)|0,y=(f[1]-50+Math.cos(t*f[3]*.7+f[2])*8)|0,a=.3+.7*Math.abs(Math.sin(t*1.3+f[2]));
      g.globalAlpha=a*.4;g.fillStyle="#FFD27A";g.fillRect(x-1,y,3,1);g.fillRect(x,y-1,1,3);g.globalAlpha=a;g.fillStyle="#FFF2B8";g.fillRect(x,y,1,1)}
    g.globalAlpha=1;
  }
  function loop(ms){frame(ms);raf=requestAnimationFrame(loop)}
  const SPLASH=["Look closer.","Now with moss!","Mind the Knockers.","Damp side up.","Slow is a speed.","Leave it where it grows."];
  const counts=()=>({f:S.obs.length,p:Object.keys(S.woven||{}).length});
  function menu(){const {f,p}=counts(),started=f>0||S.intro;
    const sum=f?`${f} find${f>1?"s":""}${p?` · ${p} place${p>1?"s":""} woken`:""}`:"";
    $("#lMenu").innerHTML=(started?`<button class="btn px" id="lGo">Continue${sum?` <small>${sum}</small>`:""}</button>`:`<button class="btn px" id="lGo">Begin</button>`)+
      `<div class="row">${started?`<button class="btn quiet px" id="lNew">New world</button>`:""}<button class="btn quiet px" id="lAbout">About</button></div>`;
    $("#lGo").onclick=()=>enter(!started);
    $("#lAbout").onclick=about;
    if(started)$("#lNew").onclick=confirmNew;
    $("#lGo").focus({preventScroll:true})}
  function panel(h){const el=$("#lPanel");el.innerHTML=h;el.hidden=false;$("#lMenu").style.visibility="hidden";
    el.querySelectorAll("[data-close]").forEach(b=>b.onclick=closePanel);el.querySelector("button")?.focus({preventScroll:true})}
  function closePanel(){$("#lPanel").hidden=true;$("#lMenu").style.visibility="";$("#lGo")?.focus({preventScroll:true})}
  function about(){panel(`<h2>About</h2><p class="small">A prototype. Photos stay on this device and are never uploaded. It doesn't identify anything: you tell it what you found.</p><p class="small">Facts marked "True to life" are real and sourced. The Kingdom is made up.</p><button class="btn quiet px" data-close style="width:100%">Back</button>`)}
  function confirmNew(){panel(`<h2>Start a new world?</h2><p class="small">This clears your pages and puts the wood back to sleep.</p><div class="row" style="display:flex;gap:10px"><button class="btn quiet px" data-close style="flex:1">Keep</button><button class="btn px" id="lWipe" style="flex:1">Start over</button></div>`);
    $("#lWipe").onclick=()=>{S=fresh();save();pending=[];rebuild(false);panTo(144,380,false);closePanel();enter(true)}}
  function enter(first){const el=$("#landing");el.classList.add("out");
    setTimeout(()=>{el.hidden=true;cancelAnimationFrame(raf);
      if(first&&!S.obs.length)showIntro(0);else{if(!S.intro){S.intro=true;save()}guideSync()}},RM?0:560)}
  function show(){const el=$("#landing");el.hidden=false;el.classList.remove("out");closePanel();menu();
    $("#lSplash").textContent=SPLASH[Math.floor(Math.random()*SPLASH.length)];
    if(RM)frame(0);else{cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}}
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#landing").hidden&&!$("#lPanel").hidden)closePanel()});
  return {show};
})();

rebuild(false);
requestAnimationFrame(()=>panTo(144,380,false));
LANDING.show();
addEventListener("resize",()=>{if($("#reveal").hidden)return});
})();
</script>
